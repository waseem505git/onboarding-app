name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom@30 (a transitive dependency via vitest, used for our DOM
          # test environment) bundles undici@8, whose WebIDL helpers require
          # Node's built-in `worker_threads.markAsUncloneable`, which only
          # exists on Node ^22.22.2 || ^24.15.0 || >=26.0.0 (see jsdom's own
          # package.json "engines" field). Node 20 does not have this
          # function, so every vitest worker fails to start with
          # "TypeError: webidl.util.markAsUncloneable is not a function"
          # even though nothing is wrong with the test code itself. Use
          # Node 24 here to match the "engines" requirement (and the local
          # dev/test environment, Node v24.19.0) so CI behaves the same as
          # local runs.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
